    <pattern id="asphalt" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#d9dbd5"/><circle cx="3" cy="10" r=".7" fill="#b9bcb8"/><circle cx="16" cy="22" r=".6" fill="#b9bcb8"/></pattern>
